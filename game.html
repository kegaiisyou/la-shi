<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F3E0C2">
<title>拉屎大作战</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #E4C79B;
    display: flex; align-items: center; justify-content: center;
    color: #4B2E16; user-select: none; -webkit-font-smoothing: antialiased;
  }
  :root {
    --ink: #4B2E16;
    --ink2: #8C6844;
    --ac1: #E9A33C;
    --ac2: #C06A22;
    --line: #E3CBA6;
  }

  #game {
    position: relative;
    width: min(100vw, 480px); height: min(100vh, 820px);
    display: flex; flex-direction: column;
    overflow: hidden;
    background: linear-gradient(178deg, #FCF4E4 0%, #F4E2C4 40%, #E9CBA1 78%, #E0BE8E 100%);
    box-shadow: 0 26px 70px rgba(90, 55, 20, .26);
  }

  /* ---------- 场景：墙砖 + 地面 + 暗角 ---------- */
  .wall {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(150, 110, 70, .085) 1px, transparent 1px),
      linear-gradient(90deg, rgba(150, 110, 70, .085) 1px, transparent 1px);
    background-size: 76px 76px;
    background-position: 50% 0;
    -webkit-mask-image: radial-gradient(90% 70% at 50% 22%, #000 0%, rgba(0,0,0,.55) 55%, transparent 100%);
            mask-image: radial-gradient(90% 70% at 50% 22%, #000 0%, rgba(0,0,0,.55) 55%, transparent 100%);
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none;
    background: linear-gradient(180deg, rgba(206,164,116,0) 0%, rgba(198,152,104,.5) 55%, rgba(178,130,84,.42) 100%);
  }
  .vig {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 110px 30px rgba(120, 76, 34, .17);
  }
  .bgfx { position: absolute; inset: 0; pointer-events: none; opacity: .8; }

  /* ---------- HUD ---------- */
  .hud { position: relative; z-index: 5; padding: 16px 18px 0; }
  .hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  h1 {
    margin: 0; font-size: 22px; letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(180deg, #7A4A22 0%, #A9682C 60%, #C4843C 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.65));
  }
  .sub { font-size: 11px; color: var(--ink2); margin-top: 3px; letter-spacing: .6px; }

  .icon {
    width: 34px; height: 34px; border-radius: 50%; padding: 0; font-size: 15px;
    background: rgba(255,255,255,.5); color: #7A5230;
    border: 1px solid rgba(150,105,60,.28);
    box-shadow: 0 2px 0 rgba(150,105,60,.16);
    flex: 0 0 auto; line-height: 1;
  }
  .icon:active { transform: translateY(2px); box-shadow: none; }
  .hud-acts { display: flex; gap: 8px; flex: 0 0 auto; }

  .userbar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px; color: var(--ink2); margin-top: 10px; min-height: 26px;
  }
  .userbar .name { font-weight: 700; color: #6B4A2F; }
  .badge {
    font-size: 9.5px; padding: 2px 7px; border-radius: 20px; margin-left: 5px;
    background: rgba(160,115,65,.16); color: #8A6038;
  }

  .score-row { text-align: center; margin-top: 2px; }
  .score {
    font-size: 58px; font-weight: 900; line-height: 1.05; letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #B8621C 0%, #8A4512 55%, #6B3510 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(255,255,255,.75));
    will-change: transform;
  }
  .score.bump { animation: scoreBump .26s cubic-bezier(.2,1.7,.42,1); }
  @keyframes scoreBump {
    0%   { transform: scale(1); }
    42%  { transform: scale(1.16) translateY(-2px); }
    100% { transform: scale(1); }
  }
  .score-label { font-size: 10.5px; color: var(--ink2); letter-spacing: 3px; margin-top: 1px; }

  /* ---------- 舞台 ---------- */
  .stage {
    position: relative; z-index: 4;
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .pool {
    position: absolute; left: 50%; top: 50%; width: 340px; height: 340px;
    transform: translate(-50%, -46%);
    background: radial-gradient(circle, rgba(255,246,225,.85) 0%, rgba(255,240,210,.42) 38%, rgba(255,235,200,0) 68%);
    pointer-events: none;
  }

  /* ---------- 落地屎堆：每爆一坨就有一坨独立的屎飞出、落地、留在原地 ---------- */
  .poop-pile {
    position: absolute; left: 0; right: 0; bottom: 6%; height: 40%;
    pointer-events: none; z-index: 3;
  }
  .landed-poop {
    position: absolute; left: 0; top: 0; width: 46px; height: 46px;
    pointer-events: none; will-change: transform;
    transition: opacity .3s;
  }
  .landed-poop .poop-inner {
    width: 100%; height: 100%; transform-origin: 50% 100%;
    animation: poopLaunch var(--flydur, .7s) linear both;
  }
  .landed-poop svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .landed-poop.hot svg { filter: drop-shadow(0 0 6px rgba(255,190,90,.85)); }
  .landed-poop.gone { opacity: 0; }
  .landed-poop.gone .poop-inner { animation: none; transform: scale(.7) rotate(var(--rot)); }
  .landed-poop.instant .poop-inner { animation: none; transform: rotate(var(--rot)); }
  .landed-poop.flushed { animation: poopFlush .44s cubic-bezier(.5,0,.9,.5) forwards; }
  @keyframes poopFlush {
    0%   { opacity: 1; }
    100% { opacity: 0; transform: translateY(150px) scale(.18) rotate(80deg); }
  }
  /* 挤压弹射：先被压扁 → duang 弹起 → 空中收拢 → 落地压扁回弹 */
  @keyframes poopLaunch {
    0%   { opacity: 0; transform: scale(3.4, 1.75) rotate(-7deg); }
    8%   { opacity: 1; }
    16%  { transform: scale(2.6, 3.5) rotate(5deg); }
    42%  { transform: scale(2.0, 2.0) rotate(9deg); }
    72%  { transform: scale(1.3, 1.3) rotate(var(--rot)); }
    92%  { transform: scale(1.34, .70) rotate(var(--rot)); }
    97%  { transform: scale(.92, 1.08) rotate(var(--rot)); }
    100% { transform: scale(1) rotate(var(--rot)); }
  }
  .char-wrap { position: relative; display: inline-block; transform: translateY(-10%); }

  .gauge {
    position: absolute; right: -2px; bottom: 34px;
    width: 13px; height: 112px; z-index: 4;
    opacity: 0; transition: opacity .16s ease;
    pointer-events: none;
  }
  .gauge-track {
    position: absolute; inset: 0; border-radius: 8px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,240,214,.48));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 5px 14px rgba(120,80,40,.2),
                0 0 0 1px rgba(150,110,70,.24);
  }
  .gauge-fill {
    position: absolute; left: 2px; right: 2px; top: 2px; bottom: 2px;
    border-radius: 6px; transform-origin: 50% 100%; transform: scaleY(0);
    background: linear-gradient(180deg, #FFCB6D 0%, #F0801F 55%, #BE4F16 100%);
    box-shadow: 0 0 9px rgba(233,116,31,.45), inset 0 1px 0 rgba(255,255,255,.5);
  }

  .char-shadow {
    position: absolute; left: 50%; bottom: -18px;
    width: 150px; height: 30px; margin-left: -75px;
    background: radial-gradient(ellipse at 50% 50%, rgba(118,72,30,.20) 0%, rgba(118,72,30,.09) 42%, rgba(118,72,30,0) 70%);
    border-radius: 50%;
    filter: blur(4px);
    transform-origin: 50% 50%;
    will-change: transform, opacity;
  }

  .poop {
    position: relative;
    width: 246px; height: 246px;
    cursor: pointer; touch-action: none; -webkit-touch-callout: none;
    transform-origin: 50% 86%;
    will-change: transform;
    /* 只把最底沿淡化一点点，让接触地面不生硬 */
    --msk: 93%; --mend: 99.5%;
    -webkit-mask-image: linear-gradient(to bottom,
      #000 0%, #000 var(--msk), rgba(0,0,0,0) var(--mend), rgba(0,0,0,0) 100%);
    mask-image: linear-gradient(to bottom,
      #000 0%, #000 var(--msk), rgba(0,0,0,0) var(--mend), rgba(0,0,0,0) 100%);
  }
  .poop:focus { outline: none; }
  .poop-svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* 角色色板（皮肤 = 调色，而不是滤镜）；四层由深到浅，让层次读得出来 */
  .p-body  { fill: var(--body); transition: fill .45s cubic-bezier(.3,.8,.3,1); }
  .p-dark  { fill: var(--dark); transition: fill .45s cubic-bezier(.3,.8,.3,1); }
  .p-light { fill: var(--light); transition: fill .45s cubic-bezier(.3,.8,.3,1); }
  .p-t1, .p-t2, .p-t3, .p-t4, .p-core { transition: fill .45s cubic-bezier(.3,.8,.3,1); }
  .p-t1 { fill: var(--t1); }
  .p-t2 { fill: var(--t2); }
  .p-t3 { fill: var(--t3); }
  .p-t4 { fill: var(--t4); }
  .p-core { fill: var(--core); }
  /* 四段软体：每段独立形变，缩放在自己底部 */
  .tier { will-change: transform; }
  .p-blush { fill: var(--blush); }
  .p-white { fill: #fff; }
  .p-ink   { fill: #2E1C0F; }
  .gloss  { fill: #fff; }
  .eye-w  { fill: #FFFFFF; }
  .eye-p  { fill: #2A1B10; }
  .eye-g  { fill: #FFFFFF; }

  /* 眨眼 */
  .eyes { animation: blink 4.6s infinite; transform-origin: 0 0; }
  @keyframes blink {
    0%, 92%, 100% { transform: translateY(118px) scaleY(1) translateY(-118px); }
    94%           { transform: translateY(118px) scaleY(.1) translateY(-118px); }
    96%           { transform: translateY(118px) scaleY(1.08) translateY(-118px); }
  }

  /* 嘴巴状态 */
  .mouth-smile { opacity: 1; transition: opacity .12s; }
  .mouth-open  { opacity: 0; transition: opacity .12s; }
  .charge .mouth-smile { opacity: 0; }
  .charge .mouth-open  { opacity: 1; }

  /* 彩虹皮肤：整只循环变色 */
  .rainbow { animation: rainbowHue 3.4s linear infinite; }
  @keyframes rainbowHue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

  /* 装饰：墨镜 / 超人 */
  .deco { display: none; }
  .skin-shades .deco-shades { display: block; }
  .skin-shades .eyes { opacity: 0; }
  .skin-super .deco-super { display: block; }
  .skin-super .eyes { opacity: 0; }
  .capeSlot { display: none; }
  .skin-super .capeSlot { display: block; animation: capeFlutter 3.2s ease-in-out infinite; }
  @keyframes capeFlutter {
    0%, 100% { transform: rotate(-1.6deg) scaleY(1); }
    50%      { transform: rotate(2.2deg) scaleY(1.02); }
  }

  .hint {
    position: absolute; left: 50%; bottom: 46%; z-index: 7;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 12px; font-weight: 700; color: #A8763E;
    letter-spacing: 1px; pointer-events: none;
    animation: hintBob 1.9s ease-in-out infinite;
  }
  .hint .hand { font-size: 20px; filter: drop-shadow(0 3px 4px rgba(140,95,50,.3)); }
  @keyframes hintBob {
    0%, 100% { transform: translate(-50%, 0); opacity: .75; }
    50%      { transform: translate(-50%, 7px); opacity: 1; }
  }
  .hint.gone { display: none; }
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; }

  /* ---------- 连击 ---------- */
  .combo {
    position: absolute; right: 18px; top: 4px; z-index: 7;
    display: flex; align-items: baseline; gap: 2px;
    padding: 5px 11px; border-radius: 20px;
    background: rgba(255,255,255,.62);
    box-shadow: 0 4px 14px rgba(140,95,50,.18);
    color: #B4581B; font-weight: 900;
    opacity: 0; transform: translateY(-6px) scale(.9);
    transition: opacity .18s, transform .18s cubic-bezier(.2,1.5,.4,1);
  }
  .combo.on { opacity: 1; transform: translateY(0) scale(1); }
  .combo .x { font-size: 11px; opacity: .75; }
  .combo .n { font-size: 19px; font-variant-numeric: tabular-nums; }
  .combo.hot { background: linear-gradient(180deg,#FFD79A,#FFB65C); color: #8A3A08; }
  .combo.blaze { background: linear-gradient(180deg,#FFB25C,#FF7A3C); color: #571A02;
                 box-shadow: 0 4px 18px rgba(255,110,50,.5); }

  /* ---------- footer ---------- */
  .foot { position: relative; z-index: 5; padding: 0 18px 18px; }
  .bar-wrap { width: 100%; max-width: 340px; margin: 0 auto; }
  .bar-label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink2); margin-bottom: 7px;
    font-variant-numeric: tabular-nums;
  }
  .bar-label b { color: #7A4A22; font-size: 12px; letter-spacing: .5px; }
  .bar {
    position: relative; height: 17px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, #E3CBAB, #D5B58C);
    box-shadow: inset 0 2px 4px rgba(120,80,40,.22), inset 0 -1px 0 rgba(255,255,255,.6);
  }
  .bar > i {
    display: block; height: 100%; width: 0%;
    border-radius: 12px;
    background: linear-gradient(180deg, #FFC972 0%, #E9A33C 45%, #CE7E28 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 0 12px rgba(233,163,60,.55);
    transition: width .34s cubic-bezier(.25,.9,.25,1);
  }
  .bar-shine {
    position: absolute; top: 0; bottom: 0; width: 44px;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);
    animation: shineSweep 3.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shineSweep {
    0%   { left: -50px; opacity: 0; }
    35%  { opacity: .9; }
    70%  { left: 105%; opacity: 0; }
    100% { left: 105%; opacity: 0; }
  }
  .msg {
    min-height: 19px; font-size: 11.5px; color: var(--ink2);
    text-align: center; margin: 9px 0 10px; letter-spacing: .3px;
  }
  /* ---------- 容器：小容量画格子，大容量只显示数字 + 进度条 ---------- */
  .toilet-row {
    width: 100%; max-width: 340px; margin: 10px auto 0;
    display: flex; align-items: center; gap: 10px;
  }
  .toilet-info { flex: 1; min-width: 0; }
  .toilet-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink2); margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  .toilet-meta b { color: #7A4A22; font-size: 12px; }
  .toilet-meta b.bump { animation: scoreBump .26s cubic-bezier(.2,1.7,.42,1); }
  .toilet-slots { display: flex; gap: 4px; }
  .toilet-slots i {
    flex: 1; height: 11px; border-radius: 7px;
    background: linear-gradient(180deg, #EAD7B8, #DCC19A);
    box-shadow: inset 0 1px 2px rgba(120,80,40,.18), inset 0 -1px 0 rgba(255,255,255,.5);
    transition: background .2s, box-shadow .2s;
  }
  .toilet-slots i.on {
    background: linear-gradient(180deg, #F4C57C, #C87B2C);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 0 7px rgba(210,130,45,.45);
  }
  .toilet-bar {
    display: none; height: 11px; border-radius: 7px; overflow: hidden;
    background: linear-gradient(180deg, #EAD7B8, #DCC19A);
    box-shadow: inset 0 1px 2px rgba(120,80,40,.18), inset 0 -1px 0 rgba(255,255,255,.5);
    font-variant-numeric: tabular-nums;
  }
  .toilet-bar.show { display: block; }
  .toilet-bar i {
    display: block; height: 100%; width: 0%;
    border-radius: 7px;
    background: linear-gradient(180deg, #F4C57C, #C87B2C);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 0 7px rgba(210,130,45,.45);
    transition: width .34s cubic-bezier(.25,.9,.25,1);
  }
  .pile-count {
    display: none; position: absolute; left: 50%; bottom: 8%;
    transform: translateX(-50%); z-index: 6; pointer-events: none;
    background: rgba(255,250,238,.88); border-radius: 20px; padding: 3px 11px;
    font-size: 12px; font-weight: 800; color: #7A4A22;
    box-shadow: 0 2px 8px rgba(120,80,40,.18); font-variant-numeric: tabular-nums;
  }
  .pile-count.show { display: block; }
  button.flush {
    padding: 9px 12px; font-size: 12px; border-radius: 12px; white-space: nowrap;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(180deg, #E9F6FB 0%, #CFE8F4 100%);
    color: #2B6E94; box-shadow: 0 3px 0 rgba(46,120,160,.25), 0 6px 12px rgba(46,120,160,.15);
  }
  button.flush:active { box-shadow: 0 0 0 rgba(46,120,160,.25); }
  button.flush.ready {
    background: linear-gradient(180deg, #7FD3F7 0%, #2E9BD1 100%);
    color: #FFF; box-shadow: 0 3px 0 #1B6E9C, 0 7px 16px rgba(46,155,209,.35);
    animation: flushPulse 1.25s ease-in-out infinite;
  }
  button.flush.ready:active { box-shadow: 0 0 0 #1B6E9C; }
  @keyframes flushPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.13); }
  }
  .btns { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }

  /* ---------- 按钮 ---------- */
  button {
    border: 0; border-radius: 13px; padding: 11px 17px;
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .5px;
    color: #FFF8EC; cursor: pointer;
    background: linear-gradient(180deg, #96602F 0%, #744522 100%);
    box-shadow: 0 3px 0 #4F2E14, 0 7px 14px rgba(79,46,20,.24);
    transition: transform .07s ease, box-shadow .07s ease, filter .15s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 #4F2E14; filter: brightness(1.06); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost {
    background: linear-gradient(180deg, #FFFDF6 0%, #F1DDBC 100%);
    color: #744522;
    box-shadow: 0 3px 0 rgba(150,105,60,.28), 0 6px 12px rgba(120,80,40,.16);
  }
  button.ghost:active { box-shadow: 0 0 0 rgba(150,105,60,.28); }
  button.sm { padding: 6px 12px; font-size: 11.5px; border-radius: 10px; box-shadow: 0 2px 0 rgba(120,80,40,.2), 0 4px 8px rgba(120,80,40,.14); }
  button.sm:active { transform: translateY(2px); box-shadow: none; }

  /* ---------- 浮层 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 200; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(58,38,18,.46);
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  }
  .overlay.show { display: flex; animation: fadeIn .22s ease-out; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .card {
    width: min(100%, 386px); max-height: 86vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, #FFFDF6 0%, #FEF6E6 100%);
    border-radius: 22px; padding: 20px;
    box-shadow: 0 24px 60px rgba(48,28,10,.42), inset 0 1px 0 #fff;
    animation: sheetIn .3s cubic-bezier(.2,1.3,.35,1);
  }
  @keyframes sheetIn {
    from { opacity: 0; transform: translateY(26px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card h2 { margin: 0 0 14px; font-size: 17px; text-align: center; letter-spacing: 1px; color: #6B4222; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; padding: 4px; border-radius: 13px; background: #F0DEC0; }
  .tabs button { flex: 1; background: transparent; color: #8A6038; box-shadow: none; padding: 9px; border-radius: 10px; }
  .tabs button.on { background: linear-gradient(180deg,#96602F,#744522); color: #FFF8EC; box-shadow: 0 2px 6px rgba(120,80,40,.24); }
  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 11px; color: var(--ink2); margin-bottom: 5px; letter-spacing: .4px; }
  .field input {
    width: 100%; padding: 11px 13px; font-size: 15px; color: #4B2E16;
    border: 1.5px solid #E4CCA8; border-radius: 12px;
    background: #FFFDF9; outline: none; transition: border-color .16s, box-shadow .16s;
  }
  .field input:focus { border-color: #E9A33C; box-shadow: 0 0 0 3px rgba(233,163,60,.18); }
  .card-msg { min-height: 17px; font-size: 11.5px; color: #B05252; text-align: center; margin: 4px 0 8px; }
  .card .primary { width: 100%; margin-top: 2px; padding: 13px; }
  .card .close { width: 100%; margin-top: 12px; background: transparent; color: #96734E; box-shadow: none; font-size: 12.5px; }
  .card .close:active { box-shadow: none; transform: scale(.98); }

  /* ---------- 支持作者 ---------- */
  .support-note { font-size: 12.5px; color: var(--ink2); text-align: center; line-height: 1.7; margin: -2px 0 14px; }
  .support-main {
    display: block; width: 100%; padding: 14px; margin-bottom: 12px;
    border-radius: 13px; text-align: center; text-decoration: none;
    font-size: 15px; font-weight: 700; letter-spacing: .5px; color: #FFF8EC;
    background: linear-gradient(180deg, #E9A33C 0%, #C06A22 100%);
    box-shadow: 0 3px 0 #8A4512, 0 7px 14px rgba(79,46,20,.24);
  }
  .support-main:active { transform: translateY(3px); box-shadow: none; }
  .support-qrs { display: flex; gap: 10px; }
  .support-qr {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 14px;
    background: #FFFDF9; border: 1.5px solid #EDD9B8;
  }
  .support-qr img {
    width: 100%; max-width: 140px; aspect-ratio: 1 / 1; object-fit: contain;
    display: block; margin: 0 auto 6px; border-radius: 8px;
  }
  .support-qr b { display: block; font-size: 12px; color: #6B4222; }
  .support-qr small { display: block; font-size: 10px; color: #A2855F; margin-top: 3px; }
  .support-empty { text-align: center; font-size: 12.5px; color: var(--ink2); line-height: 2; padding: 18px 0; }
  .support-tip { font-size: 10.5px; color: #A2855F; text-align: center; margin: 12px 0 0; line-height: 1.6; }

  /* ---------- 内嵌广告位 ---------- */
  .ad-banner {
    display: none; width: 100%; max-width: 340px; margin: 10px auto 0;
    border-radius: 11px; overflow: hidden; text-decoration: none;
    border: 1px solid rgba(150,105,60,.22); background: rgba(255,253,249,.85);
    box-shadow: 0 3px 10px rgba(120,80,40,.12);
  }
  .ad-banner img { display: block; width: 100%; height: auto; max-height: 64px; object-fit: contain; }
  .ad-banner .ab-text { display: block; font-size: 10px; color: #A2855F; text-align: center; padding: 3px 6px; }
  .ad-card { text-align: center; }
  .ad-card .ad-pic { display: block; width: 100%; max-height: 52vh; object-fit: contain; border-radius: 12px; background: #F7EFE1; }
  .ad-card .ad-txt { font-size: 12px; color: var(--ink2); margin: 10px 0 4px; line-height: 1.6; }

  /* ---------- 皮肤面板 ---------- */
  .skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .skin-item {
    position: relative; padding: 8px 4px 7px; border-radius: 15px; text-align: center;
    cursor: pointer; touch-action: none; -webkit-touch-callout: none; background: #FFFDF9;
    border: 1.5px solid #EDD9B8;
    transition: transform .12s cubic-bezier(.2,1.4,.4,1), border-color .16s, box-shadow .16s;
    overflow: hidden;
  }
  .skin-item:active { transform: scale(.94); }
  .skin-item.on {
    border-color: #E9A33C;
    background: linear-gradient(180deg, #FFF6E3, #FDEBCB);
    box-shadow: 0 0 0 3px rgba(233,163,60,.22), 0 6px 16px rgba(200,140,60,.24);
  }
  .skin-item.locked { opacity: .92; cursor: default; background: #F7EFE1; }
  .skin-item.locked .pv { filter: grayscale(.72) brightness(.96); }
  .pv { display: block; line-height: 0; margin-bottom: 2px; }
  .pv svg { width: 52px; height: 52px; }
  .skin-name { font-size: 11.5px; font-weight: 700; color: #6B4222; }
  .skin-cond { font-size: 9.5px; color: #A2855F; margin-top: 2px; min-height: 12px; }
  .skin-item.on .skin-cond { color: #C2762A; font-weight: 700; }
  .lock-tag {
    position: absolute; top: 5px; right: 5px; font-size: 10px;
    padding: 1px 5px; border-radius: 8px;
    background: rgba(120,85,50,.12); color: #8A6038;
  }

  /* ---------- 排行榜 ---------- */
  .rank-row {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 8px; border-radius: 11px; font-size: 13px;
    border-bottom: 1px dashed #EEDCBD;
  }
  .rank-row:last-child { border-bottom: 0; }
  .rank-row .no { width: 20px; font-weight: 800; color: #A2855F; font-variant-numeric: tabular-nums; }
  .rank-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-row .sc { font-weight: 800; color: #8A4512; font-variant-numeric: tabular-nums; }
  .rank-row.me { background: linear-gradient(90deg, rgba(233,163,60,.16), rgba(233,163,60,.03)); }
  .rank-row.me .no, .rank-row.me .sc { color: #C06A22; }
  .rank-row.top1 .no { color: #D79A2A; }
  .rank-empty { text-align: center; color: var(--ink2); font-size: 12.5px; padding: 22px 0; }
  .rank-tip { text-align: center; font-size: 11px; color: #9A6A32; background: rgba(233,163,60,.12); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }

  /* ---------- 飘字 / 提示 ---------- */
  .pop-num {
    position: fixed; z-index: 60; pointer-events: none;
    font-size: 26px; font-weight: 900; color: #FFFCF0;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 #A8541C, -1px 0 0 #A8541C, 1px 0 0 #A8541C, 0 -1px 0 #A8541C, 0 6px 14px rgba(140,90,45,.35);
    animation: popNum .82s cubic-bezier(.18,.9,.24,1) forwards;
    will-change: transform, opacity;
  }
  @keyframes popNum {
    0%   { opacity: 0; transform: translate(-50%, 6px) scale(.55); }
    22%  { opacity: 1; transform: translate(-50%, -14px) scale(1.18); }
    38%  { transform: translate(-50%, -20px) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -78px) scale(.92); }
  }

  .banner {
    position: absolute; left: 0; right: 0; top: 27%; z-index: 61;
    text-align: center; pointer-events: none;
    font-size: 26px; font-weight: 900; letter-spacing: 2px;
    color: #FFF9EC; opacity: 0;
    text-shadow: 0 3px 0 #A75B22, 0 0 26px rgba(255,180,90,.8);
  }
  .banner.show { animation: bannerPop 1.5s cubic-bezier(.2,1.2,.3,1) forwards; }
  @keyframes bannerPop {
    0%   { opacity: 0; transform: scale(.7) translateY(10px); }
    18%  { opacity: 1; transform: scale(1.1) translateY(0); }
    30%  { transform: scale(1); }
    72%  { opacity: 1; transform: scale(1) translateY(-6px); }
    100% { opacity: 0; transform: scale(1.04) translateY(-24px); }
  }

  .toast {
    position: absolute; left: 50%; bottom: 132px; z-index: 62;
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    padding: 8px 15px; border-radius: 20px; white-space: nowrap;
    font-size: 12px; font-weight: 600; color: #FFF9EC;
    background: rgba(84, 52, 24, .82);
    box-shadow: 0 8px 22px rgba(60,35,12,.34);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    transition: opacity .2s, transform .24s cubic-bezier(.2,1.4,.4,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 降低动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    .eyes, .bar-shine, .rainbow, .skin-super .cape { animation: none !important; }
    .poop-svg .eyes { transform: none; }
    .landed-poop .poop-inner { animation-duration: .01s !important; }
  }

  @media (max-height: 680px) {
    .score { font-size: 42px; }
    .poop { width: 158px; height: 158px; }
    .char-shadow { width: 108px; height: 20px; margin-left: -54px; bottom: -30px; }
    .pool { width: 240px; height: 240px; }
  }
</style>
</head>
<body>
<div id="game">
  <div class="wall" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"></div>
  <canvas id="bgfx" class="bgfx" aria-hidden="true"></canvas>

  <header class="hud">
    <div class="hud-top">
      <div class="brand">
        <h1>拉屎大作战</h1>
        <div class="sub">按住不放 · 憋出来 · 松手退回</div>
      </div>
      <div class="hud-acts">
        <button id="supportBtn" class="icon" aria-label="支持作者" title="支持作者">💖</button>
        <button id="soundBtn" class="icon" aria-label="音效开关">🔊</button>
      </div>
    </div>
    <div class="userbar">
      <span id="userinfo">未登录 <span class="badge" id="mode">本地</span></span>
      <span id="useracts"><button id="login" class="sm ghost">登录 / 注册</button></span>
    </div>
    <div class="score-row">
      <div class="score" id="score">0</div>
      <div class="score-label">累计便便</div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="pool" aria-hidden="true"></div>
    <div class="poop-pile" id="poopPile" aria-hidden="true"></div>
    <div class="pile-count" id="pileCount" aria-hidden="true"></div>
    <div class="char-wrap">
      <div class="hint" id="hint"><span class="hand">👇</span>按住不放，往上挤</div>
      <div class="char-shadow" id="charShadow"></div>
      <div class="poop" id="poop" role="button" tabindex="0" aria-label="按住挤出便便"></div>
      <div class="gauge" id="gauge" aria-hidden="true">
        <div class="gauge-track"><i class="gauge-fill" id="gaugeFill"></i></div>
      </div>
    </div>
    <div class="combo" id="combo" aria-hidden="true"><span class="x">连击</span><span class="n" id="comboNum">1</span></div>
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>
  </div>

  <footer class="foot">
    <div class="bar-wrap">
      <div class="bar-label"><span><b id="barLv">Lv.1</b></span><span id="barPct">0 / 10</span></div>
      <div class="bar"><i id="bar"></i><span class="bar-shine"></span></div>
    </div>
    <div class="toilet-row" id="toiletRow">
      <div class="toilet-info">
        <div class="toilet-meta"><span id="vesselName">🚽 蹲坑</span><b id="toiletPct">0 / 5</b></div>
        <div class="toilet-slots" id="toiletSlots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="toilet-bar" id="toiletBar" aria-hidden="true"><i id="toiletBarFill"></i></div>
      </div>
      <button id="flush" class="flush" disabled>🚽 冲蹲坑 0/5</button>
    </div>
    <div class="msg" id="msg">🎒 背包：<span id="best">0</span> 坨 · 云端同步</div>
    <div class="btns">
      <button id="upgrade" class="ghost">⬆️ 升级 → 便槽</button>
      <button id="skin" class="ghost">🎨 皮肤</button>
      <button id="rank" class="ghost">🏆 排行</button>
      <button id="reset" class="ghost">重新开始</button>
    </div>
    <a id="adBanner" class="ad-banner"></a>
  </footer>

  <div class="banner" id="banner" aria-hidden="true"></div>
  <div class="toast" id="toast" aria-hidden="true"></div>
  <div class="vig" aria-hidden="true"></div>
</div>

<!-- 内嵌广告（插屏 / 开屏 / 复活共用） -->
<div class="overlay" id="adOverlay">
  <div class="card ad-card">
    <h2 id="adTitle">赞助</h2>
    <a id="adLink"><img id="adImg" class="ad-pic" src="" alt="广告"></a>
    <div id="adText" class="ad-txt"></div>
    <button id="adClose" class="primary">跳过</button>
  </div>
</div>

<!-- 支持作者 -->
<div class="overlay" id="supportOverlay">
  <div class="card">
    <h2>💖 支持一下</h2>
    <div class="support-note" id="supportNote"></div>
    <div id="supportBody"></div>
    <div class="support-tip">游戏免费、无广告。你的支持就是更新的动力。</div>
    <button id="supportClose" class="close">关闭</button>
  </div>
</div>

<!-- 皮肤 -->
<div class="overlay" id="skinOverlay">
  <div class="card">
    <h2>🎨 选择你的屎</h2>
    <div class="skin-grid" id="skinGrid"></div>
    <button id="skinClose" class="close">关闭</button>
  </div>
</div>

<!-- 登录 / 注册 -->
<div class="overlay" id="authOverlay">
  <div class="card">
    <h2 id="authTitle">登录</h2>
    <div class="tabs">
      <button id="tabLogin" class="on">登录</button>
      <button id="tabReg">注册</button>
    </div>
    <div class="field"><label>用户名（2-20 字符）</label><input id="au" autocomplete="username" placeholder="用户名"></div>
    <div class="field"><label>密码（6-32 位）</label><input id="ap" type="password" autocomplete="current-password" placeholder="密码"></div>
    <div class="card-msg" id="authMsg"></div>
    <button id="authSubmit" class="primary">登录</button>
    <button id="authClose" class="close">取消</button>
  </div>
</div>

<!-- 排行榜 -->
<div class="overlay" id="rankOverlay">
  <div class="card">
    <h2>🏆 排行榜</h2>
    <div id="rankList"><div class="rank-empty">加载中…</div></div>
    <button id="rankClose" class="close">关闭</button>
  </div>
</div>

<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js" async onload="window.__sdkReady=true;window.dispatchEvent(new Event('cloudbase-ready'))" onerror="window.__sdkFailed=true"></script>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="game.js"></script>
</body>
</html>
